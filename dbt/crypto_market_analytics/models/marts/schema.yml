version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

      - name: full_date
        tests:
          - unique
          - not_null

  - name: dim_source
    columns:
      - name: source_key
        tests:
          - unique
          - not_null

      - name: source_name
        tests:
          - unique
          - not_null

  - name: dim_asset
    columns:
      - name: asset_key
        tests:
          - unique
          - not_null

      - name: asset_id
        tests:
          - not_null

      - name: symbol
        tests:
          - not_null

      - name: asset_type
        tests:
          - not_null

      - name: valid_from
        tests:
          - not_null

      - name: valid_to

      - name: is_current
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

  - name: fact_market_prices
    columns:
      - name: asset_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: source_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_source')
              field: source_key

      - name: price
        tests:
          - not_null

      - name: total_volume
        tests:
          - not_null

  - name: fact_price_trends
    columns:
      - name: asset_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_asset')
              field: asset_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: moving_avg_7d
        tests:
          - not_null

      - name: moving_avg_14d
        tests:
          - not_null

      - name: moving_avg_30d
        tests:
          - not_null