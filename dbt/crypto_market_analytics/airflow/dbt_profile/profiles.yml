crypto_market_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER', 'admin') }}"
      password: "{{ env_var('DB_PASSWORD', 'admin') }}"
      dbname: "{{ env_var('DB_NAME', 'raw_data') }}"
      schema: public
      threads: 1
      sslmode: "{{ env_var('DB_SSLMODE', 'prefer') }}"
  
     
