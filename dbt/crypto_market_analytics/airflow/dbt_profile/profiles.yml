crypto_market_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5434') | int }}"
      user: "{{ env_var('DB_USER', 'admin') }}"
      password: "{{ env_var('DB_PASSWORD', 'admin') }}"
      dbname: raw_data
      schema: public
      threads: 1
  
     
